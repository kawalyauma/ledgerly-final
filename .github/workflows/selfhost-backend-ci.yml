name: Self-hosted backend CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "modules/**/backend/**"
      - "migrations-postgres/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/selfhost-backend-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "modules/**/backend/**"
      - "migrations-postgres/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"

jobs:
  selfhost:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ledgerly
          POSTGRES_PASSWORD: ledgerly
          POSTGRES_DB: ledgerly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerly -d ledgerly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ledgerly:ledgerly@127.0.0.1:5432/ledgerly
      JWT_SECRET: ci-only-ledgerly-secret-32-characters-minimum
      ENVIRONMENT: test
      STORAGE_ROOT: /tmp/ledgerly-storage
      HOST: 127.0.0.1
      PORT: 8787
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate:selfhost
      - name: HTTP startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm run start:server >/tmp/ledgerly-api.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/system/health >/tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          curl -fsS http://127.0.0.1:8787/ >/tmp/root.json
          cat /tmp/root.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"name":"Ledgerly API"' /tmp/root.json
