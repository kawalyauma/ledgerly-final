name: Temporary local Whisper model transfer

on:
  push:
    branches:
      - tmp/local-whisper-model

permissions:
  contents: read

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download Whisper small q5_1 model
        run: |
          curl -L --fail --retry 5 --retry-delay 2 \
            -o ggml-small-q5_1.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin?download=true"
          echo "ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  ggml-small-q5_1.bin" | sha256sum -c -
          ls -lh ggml-small-q5_1.bin
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-small-q5_1
          path: ggml-small-q5_1.bin
          compression-level: 0
          retention-days: 1
