name: Node backend CI

on:
  push:
    branches: [main]
    paths:
      - "node-backend/**"
      - ".github/workflows/node-backend-ci.yml"
  pull_request:
    paths:
      - "node-backend/**"
      - ".github/workflows/node-backend-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-backend
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: ledgerly, POSTGRES_PASSWORD: ledgerly, POSTGRES_DB: ledgerly }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledgerly -d ledgerly" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://ledgerly:ledgerly@127.0.0.1:5432/ledgerly
      REDIS_URL: redis://127.0.0.1:6379
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: /tmp/ledgerly-storage
      JWT_SECRET: ci-only-secret-must-be-at-least-32-characters
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
      - name: API smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm start >/tmp/ledgerly-node-api.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/system/health >/tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          curl -fsS http://127.0.0.1:8080/ >/tmp/root.json
          grep -q '"stage":"feature-migration"' /tmp/root.json
          for key in core-identity finance-core fiscal-periods contacts documents payments banking budgets inventory fixed-assets dimensions-projects sales-purchasing tax closing compliance reports report-management document-output finance-maintenance integrations modules finance-mobile mobile-sync; do
            grep -q "\"key\":\"$key\"" /tmp/root.json
          done
          unauth_status=$(curl -sS -o /tmp/unauth.json -w '%{http_code}' http://127.0.0.1:8080/api/v1/reports/)
          test "$unauth_status" = "401"
          public_status=$(curl -sS -o /tmp/public.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8080/api/v1/mobile-sync/offline/exchange)
          test "$public_status" = "422"
