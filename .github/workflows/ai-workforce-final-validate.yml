name: AI workforce final validation

on:
  push:
    branches:
      - ai-workforce/final-compound-workers-vision
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies without rewriting repository files
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD

      - name: Import changed AI backend modules
        run: |
          npx tsx -e '
            Promise.all([
              import("./modules/agentic-employees/backend/workers-ai.ts"),
              import("./modules/agentic-employees/backend/workers-ai-routes.ts"),
              import("./modules/agentic-employees/backend/multimodal.ts"),
              import("./modules/agentic-employees/backend/chat-image-routes.ts"),
              import("./modules/agentic-employees/backend/system-tools-v16.ts"),
              import("./modules/agentic-employees/backend/executor.ts"),
              import("./modules/agentic-employees/backend/action-routes.ts"),
              import("./modules/agentic-employees/backend/openai.ts"),
              import("./modules/agentic-employees/backend/module.ts")
            ]).then(() => console.log("AI BACKEND IMPORTS OK"))
          '

      - name: Build production web app
        run: npm run build:web
