name: Agentic Chat Studio Check

on:
  push:
    branches: [agentic-chat-studio, advanced-agentic-employees]
  workflow_dispatch:

jobs:
  node-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Node backend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck Node backend
        run: npm run typecheck
      - name: Run Agentic Node regression tests
        run: npx vitest run src/features/agentic-employees/light-tool-registry.test.ts src/features/agentic-employees/quick-commands.test.ts src/features/agentic-employees/document-service.test.ts src/features/agentic-employees/system-gateway.test.ts
      - name: Strict Node build
        run: npm run build:strict

  root-chat-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm install --no-audit --no-fund
      - name: Root typecheck
        run: npm run typecheck
      - name: Run Agentic root regression tests
        run: npx vitest run modules/agentic-employees/backend/light-tool-registry.test.ts modules/agentic-employees/backend/quick-commands.test.ts selfhost/document-service.test.ts selfhost/system-gateway.test.ts
      - name: Build web
        run: npm run build:web
