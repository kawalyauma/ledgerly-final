name: Frontend UI CI

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "modules/**/frontend/**"
      - "modules/frontend-*.ts"
      - "modules/catalog.generated.ts"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/frontend-ui-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "modules/**/frontend/**"
      - "modules/frontend-*.ts"
      - "modules/catalog.generated.ts"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/frontend-ui-ci.yml"

concurrency:
  group: frontend-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync module registry
        run: npm run modules:sync
      - name: Verify generated module files are committed
        run: git diff --exit-code
      - name: Build web application
        run: npm run build:web
