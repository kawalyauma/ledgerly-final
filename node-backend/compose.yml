services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledgerly
      POSTGRES_USER: ledgerly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerly-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerly -d ledgerly"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      network: host
    restart: "no"
    command: ["node", "dist/db/migrate.js"]
    environment: &backend-env
      NODE_ENV: production
      DATABASE_URL: postgresql://ledgerly:${POSTGRES_PASSWORD:-ledgerly-change-me}@postgres:5432/ledgerly
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: /data/storage
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-long-random-production-secret}
      # Keep the main Node API and modular/self-host API on one token authority.
      JWT_ISSUER: ${JWT_ISSUER:-your-finance-pro}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-your-finance-pro-api}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      AI_PROVIDER_ENCRYPTION_KEY: ${AI_PROVIDER_ENCRYPTION_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL_LUNA: ${OPENAI_MODEL_LUNA:-}
      OPENAI_MODEL_TERRA: ${OPENAI_MODEL_TERRA:-}
      OPENAI_MODEL_SOL: ${OPENAI_MODEL_SOL:-}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build:
      context: .
      network: host
    restart: unless-stopped
    command: ["node", "dist/server.js"]
    environment: *backend-env
    volumes:
      - app-storage:/data/storage
    ports:
      - "${LEDGERLY_API_PORT:-8080}:8080"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  queue:
    build:
      context: .
      network: host
    restart: unless-stopped
    command: ["node", "dist/queue/worker.js"]
    environment: *backend-env
    volumes:
      - app-storage:/data/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  scheduler:
    build:
      context: .
      network: host
    restart: unless-stopped
    command: ["node", "dist/scheduler/scheduler.js"]
    environment: *backend-env
    volumes:
      - app-storage:/data/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  app-storage:
