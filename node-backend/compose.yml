services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledgerly
      POSTGRES_USER: ledgerly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerly-change-me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerly -d ledgerly"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      network: host
    network_mode: host
    restart: "no"
    command: ["node", "dist/db/migrate.js"]
    environment: &backend-env
      NODE_ENV: production
      DATABASE_URL: postgresql://ledgerly:${POSTGRES_PASSWORD:-ledgerly-change-me}@127.0.0.1:5432/ledgerly
      REDIS_URL: redis://127.0.0.1:6379
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: /data/storage
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-long-random-production-secret}
      JWT_ISSUER: ${JWT_ISSUER:-your-finance-pro}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-your-finance-pro-api}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      AI_PROVIDER_ENCRYPTION_KEY: ${AI_PROVIDER_ENCRYPTION_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL_LUNA: ${OPENAI_MODEL_LUNA:-}
      OPENAI_MODEL_TERRA: ${OPENAI_MODEL_TERRA:-}
      OPENAI_MODEL_SOL: ${OPENAI_MODEL_SOL:-}
      LEDGERLY_AI_ENABLED: ${LEDGERLY_AI_ENABLED:-true}
      LEDGERLY_AI_DEFAULT_PROVIDER: ${LEDGERLY_AI_DEFAULT_PROVIDER:-codex}
      LEDGERLY_AI_FALLBACK_PROVIDER: ${LEDGERLY_AI_FALLBACK_PROVIDER:-claude-code}
      LEDGERLY_AI_EXECUTION_MODE: ${LEDGERLY_AI_EXECUTION_MODE:-docker}
      LEDGERLY_AI_CODEX_IMAGE: ${LEDGERLY_AI_CODEX_IMAGE:-ledgerly-ai-codex:local}
      LEDGERLY_AI_CLAUDE_IMAGE: ${LEDGERLY_AI_CLAUDE_IMAGE:-ledgerly-ai-claude-code:local}
      LEDGERLY_AI_SESSION_ROOT: /var/lib/ledgerly-ai/sessions
      LEDGERLY_AI_WORK_ROOT: /var/lib/ledgerly-ai/workspaces
      LEDGERLY_AI_MAX_CONCURRENCY: ${LEDGERLY_AI_MAX_CONCURRENCY:-4}
      LEDGERLY_AI_MAX_QUEUE: ${LEDGERLY_AI_MAX_QUEUE:-100}
      LEDGERLY_AI_USER_REQUESTS_PER_MINUTE: ${LEDGERLY_AI_USER_REQUESTS_PER_MINUTE:-20}
      LEDGERLY_AI_ORG_REQUESTS_PER_MINUTE: ${LEDGERLY_AI_ORG_REQUESTS_PER_MINUTE:-200}
      LEDGERLY_AI_AGENT_REQUESTS_PER_MINUTE: ${LEDGERLY_AI_AGENT_REQUESTS_PER_MINUTE:-60}
      LEDGERLY_AI_CHAT_HISTORY_MESSAGES: ${LEDGERLY_AI_CHAT_HISTORY_MESSAGES:-30}
      LEDGERLY_AI_SHORT_TERM_MEMORY_DAYS: ${LEDGERLY_AI_SHORT_TERM_MEMORY_DAYS:-7}
      LEDGERLY_AI_MEMORY_RETRIEVAL_LIMIT: ${LEDGERLY_AI_MEMORY_RETRIEVAL_LIMIT:-12}
      LEDGERLY_AI_MEMORY_CONTEXT_CHARS: ${LEDGERLY_AI_MEMORY_CONTEXT_CHARS:-12000}
      LEDGERLY_AI_MAX_TOOL_STEPS: ${LEDGERLY_AI_MAX_TOOL_STEPS:-6}
      LEDGERLY_AI_TOOL_TIMEOUT_MS: ${LEDGERLY_AI_TOOL_TIMEOUT_MS:-120000}
      LEDGERLY_AI_TOOL_MAX_RESULT_BYTES: ${LEDGERLY_AI_TOOL_MAX_RESULT_BYTES:-524288}
      LEDGERLY_AI_REPO_ROOT: /opt/ledgerly/source
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build:
      context: .
      network: host
    network_mode: host
    restart: unless-stopped
    command: ["node", "dist/server.js"]
    environment:
      <<: *backend-env
      PORT: ${LEDGERLY_API_PORT:-8787}
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - app-storage:/data/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/ledgerly-ai/sessions:/var/lib/ledgerly-ai/sessions
      - /var/lib/ledgerly-ai/workspaces:/var/lib/ledgerly-ai/workspaces
      - ${LEDGERLY_SOURCE_ROOT:-/opt/ledgerly/source}:/opt/ledgerly/source
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  queue:
    build:
      context: .
      network: host
    network_mode: host
    restart: unless-stopped
    command: ["node", "dist/queue/worker.js"]
    environment: *backend-env
    volumes:
      - app-storage:/data/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  scheduler:
    build:
      context: .
      network: host
    network_mode: host
    restart: unless-stopped
    command: ["node", "dist/scheduler/scheduler.js"]
    environment: *backend-env
    volumes:
      - app-storage:/data/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  app-storage:
