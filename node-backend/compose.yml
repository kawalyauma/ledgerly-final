services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledgerly
      POSTGRES_USER: ledgerly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerly-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerly -d ledgerly"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    build:
      context: ./minio-community
      args:
        MINIO_SOURCE_REF: ${MINIO_SOURCE_REF:-7aac2a2c5b7c882e68c1ce017d8256be2feea27f}
    image: ledgerly-minio-community:7aac2a2c
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ledgerly}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ledgerly-minio-change-me}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    restart: "no"
    command: ["node", "dist/db/migrate.js"]
    environment: &backend-env
      NODE_ENV: production
      DATABASE_URL: postgresql://ledgerly:${POSTGRES_PASSWORD:-ledgerly-change-me}@postgres:5432/ledgerly
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: minio
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-ledgerly}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-ledgerly-minio-change-me}
      S3_BUCKET: ledgerly
      S3_FORCE_PATH_STYLE: "true"
      S3_AUTO_CREATE_BUCKET: "true"
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-long-random-production-secret}
      JWT_ISSUER: ${JWT_ISSUER:-your-finance-pro}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-your-finance-pro-api}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: .
    restart: unless-stopped
    command: ["node", "dist/server.js"]
    environment: *backend-env
    ports:
      - "${LEDGERLY_API_PORT:-8080}:8080"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  modular-api:
    build:
      context: ..
      dockerfile: node-backend/Dockerfile.modular
    image: node-backend-modular-api:current
    restart: unless-stopped
    command: ["npm", "run", "start:selfhost"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ledgerly:${POSTGRES_PASSWORD:-ledgerly-change-me}@postgres:5432/ledgerly
      LEDGERLY_HOST: 0.0.0.0
      LEDGERLY_PORT: "8787"
      LEDGERLY_STORAGE_DIR: /var/lib/ledgerly/objects
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-long-random-production-secret}
      JWT_ISSUER: ${JWT_ISSUER:-your-finance-pro}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-your-finance-pro-api}
      AI_PROVIDER_ENCRYPTION_KEY: ${AI_PROVIDER_ENCRYPTION_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL_LUNA: ${OPENAI_MODEL_LUNA:-gpt-5.6-luna}
      OPENAI_MODEL_TERRA: ${OPENAI_MODEL_TERRA:-gpt-5.6-terra}
      OPENAI_MODEL_SOL: ${OPENAI_MODEL_SOL:-gpt-5.6-sol}
      LEDGERLY_AGENT_SCHEDULER_ENABLED: ${LEDGERLY_AGENT_SCHEDULER_ENABLED:-false}
    volumes:
      - modular-storage:/var/lib/ledgerly/objects
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      postgres: { condition: service_healthy }

  queue:
    build: .
    restart: unless-stopped
    command: ["node", "dist/queue/worker.js"]
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  scheduler:
    build: .
    restart: unless-stopped
    command: ["node", "dist/scheduler/scheduler.js"]
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  minio-data:
  modular-storage:
