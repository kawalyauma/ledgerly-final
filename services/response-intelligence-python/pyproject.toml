[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ledgerly-response-intelligence"
version = "1.1.0"
description = "Professional evidence-grounded natural-language reasoning and response realization service for Ledgerly."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "orjson>=3.10,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]
training = [
  "torch>=2.6",
  "transformers>=5,<6",
  "datasets>=4,<5",
  "accelerate>=1,<2",
  "peft>=0.17,<1",
  "trl>=1,<2",
]
qlora = [
  "bitsandbytes>=0.47,<1",
]

[project.scripts]
ledgerly-response-intelligence = "ledgerly_response_intelligence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerly_response_intelligence"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true


[[tool.mypy.overrides]]
module = ["torch", "torch.*", "datasets", "datasets.*", "peft", "peft.*", "transformers", "transformers.*", "trl", "trl.*", "bitsandbytes", "bitsandbytes.*"]
ignore_missing_imports = true
